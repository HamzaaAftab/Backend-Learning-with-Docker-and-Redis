name: merntodoapp

services: 
  mongo:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - merntodoapp

  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app 
      - /app/node_modules
    networks: 
      - merntodoapp
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    command: npm run dev

  frontend:
    build: 
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules  
    networks: 
      - merntodoapp
    ports:
      - "5173:5173"
    command: npm run dev
    depends_on:
      - backend

volumes:
  mongo_data:

networks:
  merntodoapp:
    driver: bridge
